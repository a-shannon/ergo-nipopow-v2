[package]
name = "ergo-nipopow-v2-aggregator"
version = "0.4.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["A. Shannon"]

[workspace]

[dependencies]
bincode = "1.3"
cfg-if = "1.0.0"
clap = { version = "4.6.1", features = ["derive"] }
eyre = "0.6.12"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ergo-nipopow-v2-core = { path = "../crates/ergo-nipopow-v2-core", features = ["std", "native-pow"] }
zisk-verifier = "1.4.0-alpha"
openvm-build = { git = "https://github.com/openvm-org/openvm.git", tag = "v2.1.0" }
openvm-continuations = { git = "https://github.com/openvm-org/openvm.git", tag = "v2.1.0" }
openvm-deferral-circuit = { git = "https://github.com/openvm-org/openvm.git", tag = "v2.1.0" }
openvm-recursion-circuit = { git = "https://github.com/openvm-org/openvm.git", tag = "v2.1.0" }
openvm-sdk = { git = "https://github.com/openvm-org/openvm.git", tag = "v2.1.0" }
openvm-sdk-config = { git = "https://github.com/openvm-org/openvm.git", tag = "v2.1.0" }
openvm-transpiler = { git = "https://github.com/openvm-org/openvm.git", tag = "v2.1.0" }
openvm-stark-backend = { git = "https://github.com/openvm-org/stark-backend.git", tag = "v2.1.0", default-features = false }
openvm-stark-sdk = { git = "https://github.com/openvm-org/stark-backend.git", tag = "v2.1.0", default-features = false, features = ["cpu-backend"] }
openvm-verify-stark-circuit = { git = "https://github.com/openvm-org/openvm.git", tag = "v2.1.0" }
openvm-verify-stark-host = { git = "https://github.com/openvm-org/openvm.git", tag = "v2.1.0" }

[features]
default = []
cuda = [
    "openvm-sdk/cuda",
    "openvm-verify-stark-circuit/cuda",
]

[profile.release]
opt-level = 3
overflow-checks = true
