[workspace]
resolver = "2"
members = [
    "crates/ergo-nipopow-v2-core",
    "crates/ergo-nipopow-v2-cli",
    "crates/ergo-nipopow-v2-light",
]
exclude = [
    "guests/leaf-segment",
    "guests/agg-l1",
    "guests/agg-root",
    "guests-zisk/leaf-segment",
    "guests-zisk/agg-l1",
    "guests-zisk/agg-root",
    "host-aggregator",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["A. Shannon"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
overflow-checks = true

[profile.test]
opt-level = 2
overflow-checks = true
