[package]
name = "ergo-nipopow-v2-guest-agg-root"
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["A. Shannon"]

[workspace]

[dependencies]
openvm = { git = "https://github.com/openvm-org/openvm.git", tag = "v2.1.0", features = ["std"] }
openvm-sha2 = { git = "https://github.com/openvm-org/openvm.git", tag = "v2.1.0" }
openvm-deferral-guest = { git = "https://github.com/openvm-org/openvm.git", tag = "v2.1.0" }
openvm-verify-stark-guest = { git = "https://github.com/openvm-org/openvm.git", tag = "v2.1.0" }
ergo-nipopow-v2-core = { path = "../../crates/ergo-nipopow-v2-core", default-features = false, features = ["std", "openvm"] }
bincode = "1.3"
serde = { version = "1.0", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
overflow-checks = true
