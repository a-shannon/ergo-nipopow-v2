[package]
name = "ergo-nipopow-v2-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Standalone production CLI for Ergo NiPoPoW V2: mainnet verification, incremental segment preparation, deduplicated audit, exact-tail sync, and cold benchmarking"

[dependencies]
ergo-nipopow-v2-core = { path = "../ergo-nipopow-v2-core", features = ["std", "native-pow"] }
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
hex = "0.4"
