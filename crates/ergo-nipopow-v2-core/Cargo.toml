[package]
name = "ergo-nipopow-v2-core"
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["A. Shannon"]
description = "Production incremental Ergo NiPoPoW V2 consensus, append-only work-interval MMR, associative segment monoid, geometric work audit, native Autolykos PoW, and exact-tail verifier"

[features]
default = ["std", "native-pow"]
std = []
native-pow = ["std", "dep:k256"]
openvm = ["dep:openvm-sha2"]
zisk = ["dep:ziskos"]

[dependencies]
blake2 = { version = "0.10.6", default-features = false }
sha2 = { version = "0.10.8", default-features = false }
openvm-sha2 = { git = "https://github.com/openvm-org/openvm.git", tag = "v2.1.0", optional = true }
ziskos = { version = "1.4.0-alpha", optional = true }
num-bigint = { version = "0.4.6", default-features = false }
num-traits = { version = "0.2.19", default-features = false }
k256 = { version = "0.13.4", default-features = false, features = ["arithmetic"], optional = true }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }

[dev-dependencies]
bincode = "1.3"
