[package]
name = "ergo-nipopow-v2-zisk-agg-root"
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["A. Shannon"]

[dependencies]
ziskos = "1.4.0-alpha"
zisk-verifier = "1.4.0-alpha"
ergo-nipopow-v2-core = { path = "../../crates/ergo-nipopow-v2-core", default-features = false, features = ["zisk"] }
bincode = "1.3"
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }

[workspace]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
overflow-checks = true
